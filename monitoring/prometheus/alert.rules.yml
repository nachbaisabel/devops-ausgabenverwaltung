# Alerting rules for the Expenses application.
# All rules target SYMPTOMS the user would notice, not internal causes.
# Every rule carries a severity label and human-readable annotations.
# https://prometheus.io/docs/prometheus/latest/configuration/alerting_rules/
#
groups:
  - name: expenses
    rules:
      # The target cannot be scraped at all: process crashed, container stopped,
      # network broken. "up" is generated by Prometheus itself for every target.
      - alert: ExpensesDown
        expr: up{job="expenses"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Expenses target is not reachable"
          description: "Prometheus has not been able to scrape {{ $labels.instance }} for more than 1 minute."

      # More than 5% of requests fail with a server error (5xx) over 5 minutes.
      # 4xx are client errors and are deliberately excluded.
      # When there is no traffic both sums are 0 and the result is NaN, so the
      # alert stays silent - which is the behaviour we want.
      - alert: HighErrorRate
        expr: |
          sum(rate(flask_http_request_total{status=~"5.."}[5m]))
            /
          sum(rate(flask_http_request_total[5m]))
            > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx error rate on Expenses"
          description: "{{ $value | humanizePercentage }} of requests returned a 5xx status over the last 5 minutes (threshold 5%)."

      # 95th percentile request latency above 1 second over 5 minutes.
      # Estimated from the histogram buckets - see docs/02 for why this is
      # an approximation, not an exact percentile.
      - alert: HighLatencyP95
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(flask_http_request_duration_seconds_bucket[5m]))
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High p95 request latency on Expenses"
          description: "95th percentile latency is {{ $value | humanizeDuration }} over the last 5 minutes (threshold 1s)."

      # trigger a warning when at least 20% of requests return a 4xx error for 5 minutes
      - alert: HighClientErrorRate
        expr: |
          sum(rate(flask_http_request_total{status=~"4.."}[5m]))
            /
          sum(rate(flask_http_request_total[5m]))
            > 0.20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High 4xx error rate on Expenses API"
          description: "{{ $value | humanizePercentage }} of requests returned a 4xx status over the last 5 minutes."
