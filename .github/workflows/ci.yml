# structure copied from the CDS212 course workflow
# checks lint, formatting, tests with coverage and the container build

# Minimal starting point: one workflow, one job, a few echo steps.
# Purpose: see the mechanism run before any real work is added.
#
# To use it, copy this file to the repository ROOT under:
#   .github/workflows/ci.yml
# GitHub Actions only reads workflows from that directory, never from code/.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Check style and import order
        run: ruff check .
      
      - name: Check formatting # checks consistent appearance in code, e.g. spaces, indentation, quotation marks, line breaks
        run: ruff format --check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: | # development installation depends on both files
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests with coverage gate
        run: python -m pytest --cov=app --cov-report=term-missing
        
  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Build container image
        run: docker build --build-arg APP_VERSION=ci-${{ github.sha }} -t expenses:ci .

      - name: Smoke-test the image
        run: |
          docker run -d --name expenses-ci -p 8000:8000 expenses:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health; then
              echo "health check passed"
              docker rm -f expenses-ci
              exit 0
            fi
            sleep 1
          done
          echo "health check never passed"
          docker logs expenses-ci
          docker rm -f expenses-ci
          exit 1
